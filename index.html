<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween 2026: The Ultimate Spooky Party</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      background-image: url("halloween-background.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
    }

    .player {
      position: fixed;
      left: 50%;
      bottom: 4vh;
      transform: translateX(-50%);
      width: min(720px, 88vw);
      aspect-ratio: 16 / 9;
      box-shadow: 0 8px 30px rgba(0,0,0,.75);
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 700px) {
      .player {
        bottom: 2vh;
        width: 94vw;
      }
    }
  </style>
</head>
<body>
  <div class="player">
    <iframe
      src="https://www.youtube.com/embed/videoseries?list=PLPpXqXEr01uYSO_LvTFXDI5Vs04M-8QAY&shuffle=1&rel=0"
      title="Halloween 2026: The Ultimate Spooky Party"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
